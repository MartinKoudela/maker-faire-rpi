[project]
name = "maker-faire-rpi"
version = "0.1.0"
description = "Vision booth for Maker Faire Olomouc: local YOLO tracking, people counting, optional OpenAI scene description"
requires-python = ">=3.11"
dependencies = ["flask", "python-dotenv", "ncnn", "supervision", "opencv-python-headless", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maker_vision"]
